  <link rel="icon" href="/images/logo-veeakker.png">

  <script>
    (function(){
      function gc(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}
      function sc(n,v,age){document.cookie=n+'='+encodeURIComponent(v)+'; path=/; max-age='+age+'; SameSite=Lax';}
      var brand=(document.querySelector('meta[name="marketplace-brand"]')||{}).content||'';
      var isGoedgekozen=(brand==='goedgekozen');
      var prefKey=isGoedgekozen?'goedgekozen-theme':'veeakker-theme';
      var osKey=isGoedgekozen?'goedgekozen-theme-os':'veeakker-theme-os';
      var osNow=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
      var osLast=gc(osKey);
      var pref=gc(prefKey)||localStorage.getItem(prefKey);
      sc(osKey,osNow,31536000);
      var effective;
      if(!isGoedgekozen&&osLast&&osLast!==osNow){
        sc(prefKey,'',0);
        try{localStorage.removeItem(prefKey);}catch(e){}
        effective=osNow;
      } else {
        if(isGoedgekozen){
          effective=(pref==='light'||pref==='dark')?pref:'light';
        } else {
          effective=(pref==='light'||pref==='dark')?pref:osNow;
        }
      }
      document.documentElement.setAttribute('data-theme',effective);
    })();
  </script>

  <link integrity="" rel="stylesheet" href="{{rootURL}}assets/veeakker.css">
